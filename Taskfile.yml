version: "3"

vars:
  # Latest version from changelog.md, embedded into binaries via -ldflags
  VERSION:
    sh: sed -n 's/^# \([0-9][^ ]*\) - .*/\1/p' changelog.md | head -1
  LDFLAGS: -X main.version={{.VERSION}}

tasks:
  default:
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet across the module
    cmds:
      - go vet ./...

  lint:
    desc: Run go fmt, go vet, golangci-lint and gopls diagnostics (fails on any finding)
    deps:
      - fmt
      - vet
    cmds:
      - golangci-lint run ./...
      - task: gopls-check

  gopls-check:
    desc: Run gopls diagnostics only (includes modernize analyzer)
    cmds:
      # gopls exits 0 even when it reports diagnostics, so fail on any output
      - |
        out=$(find . -name "*.go" -type f -not -path "./bin/*" | xargs gopls check -severity=hint)
        if [ -n "$out" ]; then echo "$out"; exit 1; fi

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  build:
    desc: Build the pkgpulse CLI into bin/
    cmds:
      - mkdir -p bin
      - go build -ldflags "{{.LDFLAGS}}" -o bin/pkgpulse .

  install:
    desc: Install pkgpulse into $GOBIN (or $GOPATH/bin)
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" .

  check:
    desc: Run every quality gate (lint, test, build) - run before committing or releasing
    cmds:
      - task: lint
      - task: test
      - task: build

  deps:
    desc: Upgrade direct dependencies and tidy go.mod/go.sum
    cmds:
      - go get -u $(go list -m -f '{{"{{"}}if not (or .Indirect .Main){{"}}"}}{{"{{"}}.Path{{"}}"}}{{"{{"}}end{{"}}"}}' all)
      - go mod tidy

  clean:
    desc: Remove built binaries
    cmds:
      - rm -rf bin/

  version:
    desc: Get the latest version from changelog.md
    cmds:
      - mdrelease version

  release:
    desc: Run all checks, then tag and push using the latest changelog entry
    cmds:
      - task: check
      - mdrelease
